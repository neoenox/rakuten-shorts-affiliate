topic: iPhoneのバッテリーは何回充電すると劣化するのか
viewer_question: 毎日のように充電しているiPhoneのバッテリーは、何回充電すると劣化するのか。何を避ければ長持ちするのか。
audience: iPhone利用者・スマホで視聴・節約と買い替えに関心がある人
source_urls:
- https://support.apple.com/ja-jp/101575
- https://www.apple.com/jp/batteries/maximizing-performance/
verified_facts:
- Appleのサポートページは、iPhone 14モデル以前のバッテリーについて「理想的な条件下で使用された場合、フル充電サイクルを500回繰り返した後も本来の蓄電容量の80%を維持するよう設計されています」と記載している。
- 同じページは、iPhone 15モデルについて「フル充電サイクルを1,000回繰り返した後も本来の蓄電容量の80%を維持するよう設計されています」と記載している。
- 同じページは「iPhoneを長時間直射日光にさらすなど、高温環境下で充電したり放置するのは避けましょう」と記載している。
- 同じページは「iPhoneを長期間保管するときは50%前後充電した状態にしておきます」と記載している。
- 同じページは「充電式バッテリーはすべて消耗品で、化学的経年劣化が進むにつれて性能が低下します」と記載している。
caveats:
- 500回・1,000回は「設計上の目安」であり、その回数で必ず80%になるという予測ではない。使い方で変わる。
- 「毎日1回フル充電すると○日で500回」は単純な割り算であり、実際の充電サイクルは残量によって変わる。断定しない。
- 高温を避ける・50%前後で保管、はいずれもAppleの記載の範囲で言う。
- バッテリー交換の費用や時期は変わるため、金額は出さない。
visual_assets: AI生成の情景イメージ・自作イラスト・模式図のみ。Appleの製品画像・ロゴ・画面は使わない。
