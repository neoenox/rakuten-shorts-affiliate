topic: "テレビの省エネモードと電源オフの節電効果（1.8〜3.0%）"
viewer_question: "テレビの省エネモードは、 設定を変えるだけで本当に節電になる？"
audience: "一般視聴者・予備知識なし"
source_urls:
  - "https://www.enecho.meti.go.jp/about/special/johoteikyo/setsuden_tips.html"
verified_facts:
  - "資源エネルギー庁『エネこれ』の節電Tips（テレビ）には、見ている時でも『省エネモード』に設定して輝度（画面の明るさ）を下げれば節電になると書かれている。"
  - "同じ項目に、見ていない時は電源をオフにしましょうとあり、これらを合わせた節電効果は1.8％〜3.0％と記載されている。"
  - "同ページ冒頭に、節電効果（消費電力の削減率）は19時ごろの家庭の電力使用量に対する概算値で、地域・時間帯によって変動すると明記されている。"
caveats:
  - "1.8〜3.0％は省エネモード単体の数字ではない。輝度を下げることと見ていない時の電源オフを合わせた効果として書かれている。"
  - "19時ごろの家庭の使用量に対する概算。全国共通の固定値として言わない。"
  - "地震・防災や健康効果の話ではない。省エネ設定の話に留める。"
visual_assets: "自作の模式図: テレビ画面の輝度比較、電源オン／オフの状態、1.8〜3.0％の数字と19時ごろ・概算・地域差の注記。実在の商品・ロゴ・レビュー画像は使わない。"
