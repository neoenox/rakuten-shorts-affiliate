topic: 冬の暖房、3つの行動で年いくら変わるか
viewer_question: 暖房の設定温度・使用時間・フィルター掃除という3つの行動は、それぞれ年いくらの差になり、合わせるといくらになるのか。
audience: 冬の電気代が気になる人・スマホで視聴・一人暮らし〜家族世帯
source_urls:
- https://www.enecho.meti.go.jp/category/saving_and_new/saving/general/howto/airconditioning/index.html
verified_facts:
- 資源エネルギー庁の省エネポータルは、エアコン暖房の設定温度を1℃下げた場合を、年間で電気32.7kWhの省エネ、原油換算7.3L、CO2削減量14.1kg、約490円の節約と記載している（東京をモデルとした木造南向き住宅・2.5kW）。
- 同ページは、暖房の使用時間を1日1時間短縮した場合を、年間で電気73.96kWhの省エネ、原油換算16.5L、CO2削減量36.8kg、約1,110円の節約と記載している（同じ条件）。
- 同ページは、エアコンのフィルターを2週間に1回掃除した場合を、年間で電気77.94kWhの省エネ、原油換算17.4L、CO2削減量34.9kg、約1,170円の節約と記載している（同じ条件）。
- 同ページは、金額換算の電気料金単価を31円/kWhとし、令和4年7月の新電力料金目安単価（税込）を出典としている。
caveats:
- 3つの合計（約2,770円）は**単純な足し算**であり、実際には効果が重なる（例: 時間を短縮しつつ温度も下げる）。合計は上限の目安として示す。
- 試算条件は東京をモデルとした木造南向き住宅・エアコン2.5kW。地域・住宅・機器で変わる。
- 金額は31円/kWh（令和4年7月）で換算した値。単価は時期・地域・契約で変わる。
visual_assets: AI生成のイメージと自作の模式図。商品画像は使わない。
