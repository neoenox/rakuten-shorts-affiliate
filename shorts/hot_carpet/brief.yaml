topic: 電気カーペットの電気代（設定温度と広さ）
viewer_question: 電気カーペットは、設定を1段下げるのと、部屋の広さに合わないものを使うのと、どちらが電気代に効くのか。
audience: 一般視聴者・一人暮らし〜家族世帯・スマホで視聴
source_urls:
- https://www.enecho.meti.go.jp/category/saving_and_new/saving/general/howto/airconditioning/index.html
- https://www.enecho.meti.go.jp/category/saving_and_new/saving/general/howto/index.html
verified_facts:
- 資源エネルギー庁の省エネポータルは、電気カーペット（3畳用・1日5時間使用）で設定温度を「強」から「中」にした場合を、
  年間で電気185.97kWhの省エネ、原油換算41.47L、CO2削減量78.5kg、約5,770円の節約と記載している。
- 同ページは、室温20℃・1日5時間使用で、3畳用と2畳用のカーペットを比較し、年間で電気89.91kWhの省エネ、
  原油換算20.05L、CO2削減量37.9kg、約2,790円の節約と記載している。
- 同ページの省エネレッスンは、電気カーペットの下に断熱マットなどを敷くこと、人のいない部分は温めないこと、
  広さに合った大きさを選ぶことを挙げている（断熱マットの効果額は記載なし）。
- 同サイトの算出根拠は、金額換算の電気料金単価を31円/kWhとし、令和4年7月の新電力料金目安単価（税込）を出典としている。
caveats:
- 試算条件は「3畳用・1日5時間・室温20℃」など。実際の電気代は広さ・断熱性能・使い方で変わる。
- 「強」から「中」に下げると暖かさは変わる。我慢を勧めるのではなく、断熱マットや服で補う方向で書く。
- 断熱マットの節約額は公的資料に記載が無いため、数値は出さない。
- 金額は31円/kWh（令和4年7月）で換算した値。単価は時期・地域・契約で変わる。
visual_assets: すべてAI生成の情景イメージと模式図。実在の商品・ロゴ・店舗名は描かない。数値はテロップと図解で表示する。
