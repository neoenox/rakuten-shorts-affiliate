topic: "節電のピークは2つある（総需要13-17時・家庭18時ごろ・需給がきびしい17-20時）"
viewer_question: "節電するなら、昼の13〜17時と夕方17〜20時、どちらを意識すればいい？"
audience: "一般視聴者・予備知識なし"
source_urls:
  - "https://www.enecho.meti.go.jp/about/special/johoteikyo/setsuden_tips.html"
verified_facts:
  - "夏の日本の電力需要グラフでは、総需要は13:00-17:00ごろの日中に高まる。北海道・沖縄・それ以外のエリアでカーブの形は少しずつ異なる。"
  - "同じグラフで、家庭用はどのエリアでも18時ごろの夕方から夜にかけてピークになる。"
  - "太陽光発電は日が沈む夕方から夜にかけて発電量が大きく下がる。そのため17:00-20:00ごろは電力需給がきびしくなる傾向と書かれている。"
  - "19時ごろの家庭の電気使用割合の例では、エアコン・照明・冷蔵庫・炊事・テレビなどが大きい割合を占める。"
  - "節電効果（消費電力の削減率）は19時ごろの家庭の電力使用量に対する概算値で、地域・時間帯によって変動すると明記されている。"
caveats:
  - "13-17時は総需要のピーク、17-20時は需給がきびしい傾向の時間帯で、同じ意味ではない。"
  - "夏のグラフの話。地域によってカーブの形が異なるため、数字を全国共通として言わない。"
  - "再エネ12%は2019年度の一次エネルギー供給に占める割合。数字を使うなら条件を画面に出す。"
visual_assets: "自作の模式図: 総需要と家庭用の2本の需要カーブ、夕方に下がる太陽光発電カーブ、19時ごろの家庭内使用割合（エアコン・照明・冷蔵庫・炊事・テレビ）。元グラフの画像は複製せず、数値・条件はテロップで表示。"
