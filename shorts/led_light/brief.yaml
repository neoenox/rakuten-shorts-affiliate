topic: 白熱電球をLEDに替えると年いくら変わるか
viewer_question: 白熱電球のまま使い続けると年いくら損なのか。LEDに替えるとどれだけ変わり、点灯時間や調光ではどう違うのか。
audience: 一人暮らし〜家族世帯・電気代が気になる人・スマホ視聴
source_urls:
- https://www.enecho.meti.go.jp/category/saving_and_new/saving/general/howto/lighting/index.html
verified_facts:
- 資源エネルギー庁の省エネポータルは、54Wの白熱電球から7.5Wの電球形LEDランプに交換した場合（年間2,000時間使用）を、年間で電気93.00kWhの省エネ、原油換算20.74L、CO2削減量39.2kg、約2,880円の節約と記載している。
- 同ページは、12Wの電球形蛍光ランプから7.5Wの電球形LEDランプに交換した場合を、年間で約280円の節約と記載している。
- 同ページは、68Wの蛍光灯器具から34WのLED照明器具に交換した場合（年間2,000時間使用）を、年間で電気68.00kWhの省エネ、約2,110円の節約と記載している。
- 同ページは、34WのLED照明器具1灯の点灯時間を1日1時間短縮した場合を、年間で電気12.41kWh、約380円の節約と記載している。
- 同ページは、34WのLED照明器具1灯を1日1時間だけ50％に調光した場合を、年間で電気6.21kWh、約190円の節約と記載している。
caveats:
- 年間2,000時間使用（1日あたり約5.5時間）を前提とした試算。使用時間が違えば金額も変わる。
- 金額は31円/kWh（令和4年7月の新電力料金目安単価）で換算した値。
- LEDランプ本体の購入費は含まない。元が取れるまでの期間は製品価格で変わる。
- 白熱電球からLEDへの交換は、器具の対応（密閉器具・調光器対応など）を確認する必要がある。
visual_assets: 自作イラストと模式図。商品画像は使わない。
