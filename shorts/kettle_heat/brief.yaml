topic: 電気ポットの保温とコンロの火加減で年いくら変わるか
viewer_question: 電気ポットの保温をつけたままにするのと、コンロを強火のままにするのは、年いくら損なのか。
audience: 一人暮らし〜家族世帯・キッチン家電を使う人・スマホ視聴
source_urls:
- https://www.enecho.meti.go.jp/category/saving_and_new/saving/general/howto/kitchen/index.html
verified_facts:
- 資源エネルギー庁の省エネポータル（キッチン）は、電気ポットに満タンの水2.2Lを入れ沸騰させ、1.2Lを使用後、6時間保温した場合と、プラグを抜いて保温せず再沸騰させて使用した場合を比較し、年間で電気107.45kWhの省エネ、原油換算23.96L、CO2削減量45.3kg、約3,330円の節約と記載している。
- 同ページは、ガスコンロで水1L（20℃程度）を沸騰させる時に強火から中火にした場合（1日3回）を、年間でガス2.38m3の省エネ、約390円の節約と記載している。
- 同ページの電気ポットの省エネレッスンは、低めの温度で保温し必要な時にその都度再沸騰させること、長時間使わないときはプラグを抜くこと、断熱を強化した省エネタイプがあることを挙げている。
- 同ページのガスコンロの省エネレッスンは、鍋の水滴をふき取ること、平たい底の鍋を使うこと、点火は鍋をのせてからにすることを挙げている。
caveats:
- 電気ポットの試算は「2.2L満タン沸騰・1.2L使用・6時間保温」という条件。使い方が違えば金額も変わる。
- コンロの試算は「水1L・1日3回」。家族の人数や料理の回数で変わる。
- 合計（約3,720円）は単純な足し算で、実際は条件が異なる。合計は目安。
- 金額は31円/kWh（電気）とガス料金の目安で換算した値。契約により変わる。
- 保温をやめると、その都度沸かす手間が増える。手間と金額のどちらを取るかは人による。
visual_assets: 自作イラストと模式図。商品画像は使わない。
