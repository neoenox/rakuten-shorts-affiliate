topic: 家具の転倒防止、突っ張り棒だけで足りるのか
viewer_question: 家具の転倒防止は突っ張り棒だけで足りるのか。何が最も効き、突っ張り棒を使うなら何と組み合わせるべきか。
audience: 一人暮らし〜家族世帯・賃貸を含む・スマホ視聴・予備知識なし
source_urls:
- https://www.bousai.metro.tokyo.lg.jp/bousai/1000027/1005737.html
- https://www.tfd.metro.tokyo.lg.jp/content/000010472.pdf
verified_facts:
- 東京都防災ホームページは「近年の地震による負傷者の30～50％は、家具類の転倒・落下・移動が原因です」と記載している。
- 同ページは「最も確実な方法は、壁にL型金具でネジ止めすることです。ネジ止めが難しい場合は、突っ張り棒とストッパー式、突っ張り棒と粘着マットを組み合わせると効果が高くなります」と記載している。
- 同ページは、L型金具について「スライド式、上向き、下向き取り付け式があり、下向き取り付けが最も強度が高い」と記載している。
- 東京消防庁「家具類の転倒・落下・移動防止対策ハンドブック」（令和6年1月）は、近年の地震でけがをした原因の約30〜50％が家具類の転倒・落下・移動によるものとし、地震ごとの割合として宮城県北部地震49.4％、岩手・宮城内陸地震44.6％、新潟県中越地震41.2％、新潟県中越沖地震40.7％、熊本地震（高層マンション）40.0％、十勝沖地震36.3％、福岡県西方沖地震36.0％、能登半島地震29.4％、熊本地震（一般住宅）29.2％を挙げている。
- 同ハンドブックは、震度6強の揺れを再現した実験について「家具をL型金具などで壁に直接ネジ固定する方法が最も効果が高い」「ポール式の場合は、ストッパー式や粘着マット式を併用すると効果が高い」「マット式やストッパー式の器具の単独使用は効果が小さい」と記載している。
- 同ハンドブックは、ポール式（つっぱり棒式）について「背の高い家具の場合は、単独で使用しても効果は小さい」「天井に強度が必要」と記載している。
- 同ハンドブックは、ポール式器具の取付けについて「家具の両端の側板部の壁側奥に設置」「できるだけ奥に取付け」「天井に十分な強度（マンションのコンクリート天井など）があることを確認」「奥行きのない家具や天井との間隔が大きい場合には不向き」と記載している。
- 同ハンドブックは、ストッパー式器具について「家具の端から端まで敷きます」と記載している。
- 同ハンドブックは、壁へのネジ固定について「家具を固定する対象は、壁下地の柱、間柱、胴縁等」とし、「木ネジは長めのものを使用し、ネジ頭までしっかりねじ込みます」と記載している。
caveats:
- 実験は震度6強の揺れを再現したもので、すべての家具・建物で同じ効果になるわけではない。
- 壁や天井の下地の状態で効果は変わる。判断に迷う場合は管理会社や専門家に確認する。
- 賃貸でネジ止めできない場合の代替は、突っ張り棒とストッパー式・粘着マットの併用。天井の強度が必要。
- 商品の購入や取り付け効果を保証するものではない。
visual_assets: 自作イラストと模式図。商品画像は使わない。L型金具・突っ張り棒・ストッパーは模式図で描く。
