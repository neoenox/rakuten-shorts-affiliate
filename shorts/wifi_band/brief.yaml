topic: Wi-Fiが遅いとき、2.4GHzと5GHzのどちらを選ぶか
viewer_question: Wi-Fiが遅いとき、まず何を見ればよいのか。2.4GHzと5GHzの違いと、チャネルの重なりはどう関係するのか。
audience: 一人暮らし〜家族世帯・自宅のWi-Fiが遅い人・スマホ視聴
source_urls:
- https://www.tele.soumu.go.jp/j/sys/others/wlan_outdoor/index.htm
- https://www.soumu.go.jp/main_content/000976221.pdf
verified_facts:
- 総務省 電波利用ポータルは、無線LANが使用する周波数帯を「2.4GHz帯、5GHz帯及び6GHz帯」とし、5GHz帯はさらに「5.2GHz、5.3GHz、5.6GHz帯と使用条件が相違する」と記載している。
- 同ページの表では、屋内利用は2.4GHz・5.2GHz・5.3GHz・5.6GHz・6GHzのすべてで可能。屋外利用は2.4GHzと5.6GHzが可能で、5.3GHzは不可、6GHzは「Low Power Indoor (LPI)：× Very Low Power (VLP)：○」としている。
- 同ページは、5.2GHz帯が衛星通信システムのフィーダリンクと周波数を共用し、隣接周波数帯に気象レーダーが使用しているため、屋外・上空利用には条件があると記載している。
- 同ページは、5.3GHz帯及び5.6GHz帯について「DFS機能の具備が必須（屋内・屋外問わず）」と記載している。
- 総務省「ローカル５Ｇ等入門用資料」は、電波の伝わり方について「回折（障害物の後ろにも回り込んで伝わる）」を挙げ、「回折で回り込む度合いは、基本的に周波数が低いほど大きい」と記載している。
- 同資料は、干渉について「通信したい相手からの受信電波に、他の通信機からの電波が同じ周波数・同じタイミングで重なると干渉になる」とし、避ける手法として「周波数帯、空間、時間をずらすことが効果的」と記載している。
- 同資料は、チャネル設定について「各チャネルが使用する周波数帯が重複していないか確認しましょう」とし、例として「2.4GHz帯のWi-Fiで重複しないチャネルは5チャネル以上離れたチャネル」「1チャネルを使用する場合は、周波数帯が重複する2〜5チャネルは使用せず、重複しない6〜14チャネルを使用する」と記載している。
- 同資料の比較表では、Wi-Fi（Wi-Fi 6）の周波数帯を2.4GHz・5GHz、伝送距離を約20〜30mとしている。
caveats:
- 実際の速度や電波の届き方は、ルーターの出力・筐体・壁の材質・周辺機器によって変わる。
- 「2.4GHzは遅い／5GHzは速い」と単純に言い切れるものではない。周波数の特性と干渉状況の話として説明する。
- 5GHzの屋外利用や上空利用には条件がある。この動画は屋内の一般家庭を前提にする。
- 中継機を買う前に、まずバンドとチャネルの設定を見直すのが順番。
visual_assets: 自作の模式図とイラスト。電波の回折、チャネルの重なり、バンドの使い分けを図で示す。商品画像は使わない。
