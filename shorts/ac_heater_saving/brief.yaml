topic: エアコン暖房の節約（設定温度を下げる・運転時間を短くする・フィルターを掃除する）
viewer_question: 冬の電気代をいちばん下げるのは、暖房の設定温度を下げることか、つける時間を減らすことか、それとも別の作業か。
audience: 一般視聴者・賃貸の一人暮らし〜家族世帯・スマホで視聴
source_urls:
- https://www.enecho.meti.go.jp/category/saving_and_new/saving/general/howto/airconditioning/index.html
- https://www.enecho.meti.go.jp/category/saving_and_new/saving/general/howto/index.html
verified_facts:
- 資源エネルギー庁の省エネポータル（空調）は、暖房期間中にエアコン（2.5kW）の設定温度を1℃下げた場合を、
  年間で電気15.80kWhの省エネ、原油換算3.52L、CO2削減量6.7kg、約490円の節約と記載している。
- 同ページは、暖房期間中にエアコン（2.5kW）の使用を1日1時間短縮した場合を、年間で電気35.68kWhの省エネ、
  原油換算7.96L、CO2削減量15.1kg、約1,110円の節約と記載している。
- 同ページは、フィルターを月に1回か2回清掃した場合（フィルターが目詰まりしているエアコン（2.5kW）との比較）を、
  年間で電気37.90kWhの省エネ、原油換算8.45L、CO2削減量16.0kg、約1,170円の節約と記載している。
  前提として「フィルターの目詰まりによる風量低下率を20%と想定」と明記されている。
- これらの試算は「東京をモデルとした木造南向き住宅を想定（JIS C 9612:2013）」と明記されている。
- 同サイトの算出根拠ページは、金額換算に使う電気料金の単価を 31円/kWh とし、
  「令和4年7月 公益社団法人 全国家庭電気製品公正取引協議会 新電力料金目安単価（税込）」を出典として挙げている。
- 同ページは、暖房の工夫として「厚手のカーテンを使用」「扇風機を併用して暖まった空気を循環」を挙げ、
  エアコンの「フィルターを月に1回か2回清掃」を推奨している。
caveats:
- 試算条件は「東京をモデルとした木造南向き住宅（JIS C 9612:2013）」「エアコン2.5kW」。地域・住宅・機器・使い方で結果は変わる。
- 金額は31円/kWh（令和4年7月の新電力料金目安単価）で換算した値。料金単価は時期・地域・契約で変わる。
- フィルター掃除の効果は「目詰まりで風量が20%落ちている状態」との比較。汚れ具合で変わる。
- 3つの行動の効果額は同じページの試算だが、行動どうしの比較を公式がしているわけではない。金額の大小は「この試算条件での値」として扱う。
- 節約額を保証する表現はしない。「必ず○円安くなる」とは言わない。
- 体感温度を下げる我慢を勧めるのではなく、掃除・運転時間・空気の循環という「手を動かす」方向でまとめる。
visual_assets: すべてAI生成の情景イメージと模式図。実在の商品・ロゴ・店舗名は描かない。数値はテロップと図解で表示する。
