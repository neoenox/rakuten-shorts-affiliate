topic: 冷蔵庫の4つのクセを直すと年いくら変わるか
viewer_question: 温度設定・扉の開け方・開けている時間・設置場所という4つのクセは、それぞれ年いくらの差になり、合わせるといくらになるのか。
audience: 電気代が気になる人・一人暮らし〜家族世帯・スマホ視聴
source_urls:
- https://www.enecho.meti.go.jp/category/saving_and_new/saving/general/howto/kitchen/index.html
verified_facts:
- 資源エネルギー庁の省エネポータル（キッチン）は、冷蔵庫の温度設定を「中」から「弱」にした場合を、年間で電気63.45kWhの省エネ、原油換算14.15L、CO2削減量26.8kg、約1,970円の節約と記載している。
- 同ページは、1回あたりの開放時間を20秒から10秒に短くした場合を、年間で電気24.00kWhの省エネ、約740円の節約と記載している（1日の開閉回数は冷蔵室30回・冷凍室8回と想定）。
- 同ページは、1日あたりの開閉回数を半分にした場合（冷蔵室30回⇒15回、冷凍室8回⇒4回）を、年間で電気10.90kWhの省エネ、約340円の節約と記載している（1回10秒と想定）。
- 同ページは、上と両側が壁に接している場合と片側が壁に接している場合の比較で、年間で電気45.08kWhの省エネ、約1,400円の節約と記載している。
- 同ページの省エネレッスンは、熱いものはさましてから保存すること、庫内の温度設定を適切にすること（「強」なら「中」や「弱」に。ただし食品の傷みに注意）を挙げている。
caveats:
- 4つの合計（約4,450円）は単純な足し算であり、実際には効果が重なる。合計は目安。
- 温度設定を下げると食品が傷みやすくなる。公的資料も「食品の傷みには注意」としている。設定変更は自己責任で、夏場は特に注意。
- 金額は31円/kWh（令和4年7月の新電力料金目安単価）で換算した値。機種・容量・使い方で変わる。
visual_assets: 自作イラストと模式図。商品画像は使わない。
